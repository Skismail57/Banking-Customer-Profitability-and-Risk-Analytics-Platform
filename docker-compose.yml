version: '3.8'

# Banking Analytics Platform - Core Services
# To include streaming infrastructure (Redpanda, Redis), run:
# docker-compose -f docker-compose.yml -f docker-compose.streaming.yml up

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: banking_analytics_db
    environment:
      POSTGRES_DB: ${DB_NAME:-banking_analytics}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - banking_network
    restart: unless-stopped

  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: banking_analytics_api
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-banking_analytics}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8501}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src:ro
      - ./api:/app/api:ro
      - ./config:/app/config:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - banking_network
    restart: unless-stopped

  # Streamlit Application
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: banking_analytics_streamlit
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-banking_analytics}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      CACHE_TTL: ${CACHE_TTL:-3600}
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    volumes:
      - ./src:/app/src:ro
      - ./frontend:/app/frontend:ro
      - ./config:/app/config:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8501')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - banking_network
    restart: unless-stopped

  # Analytics Pipeline (Optional - for running ETL/analytics jobs)
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: banking_analytics_pipeline
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-banking_analytics}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      PIPELINE_MODE: batch
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src:ro
      - ./config:/app/config:ro
      - ./data:/app/data
    command: ["python", "-m", "src.pipeline.orchestrator"]
    networks:
      - banking_network
    profiles:
      - pipeline

networks:
  banking_network:
    name: banking_network
    driver: bridge

volumes:
  postgres_data:
    driver: local
