apiVersion: v1
kind: Secret
metadata:
  name: banking-analytics-secrets
  namespace: production
type: Opaque
stringData:
  # Database credentials
  db-host: "postgres-production.example.com"
  db-port: "5432"
  db-name: "banking_analytics"
  db-user: "banking_analytics_user"
  db-password: "CHANGE_ME_IN_PRODUCTION"
  
  # Redis credentials
  redis-host: "redis-production.example.com"
  redis-port: "6379"
  redis-password: "CHANGE_ME_IN_PRODUCTION"
  
  # Kafka configuration
  kafka-broker: "kafka-production.example.com:9092"
  
  # JWT secret
  jwt-secret-key: "CHANGE_ME_IN_PRODUCTION_MIN_32_CHARS"
  
  # External service credentials
  slack-webhook-url: "https://hooks.slack.com/services/CHANGE_ME"
  email-smtp-host: "smtp.example.com"
  email-smtp-port: "587"
  email-smtp-user: "alerts@banking-analytics.com"
  email-smtp-password: "CHANGE_ME"
