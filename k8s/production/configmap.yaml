apiVersion: v1
kind: ConfigMap
metadata:
  name: banking-analytics-config
  namespace: production
data:
  LOG_LEVEL: "INFO"
  CORS_ORIGINS: "https://app.banking-analytics.com"
  CACHE_TTL: "3600"
  STREAMING_CONFIG: |
    kafka:
      broker: "${KAFKA_BROKER}"
      group_id: "banking-analytics-production"
      auto_offset_reset: "latest"
      enable_auto_commit: true
    redis:
      host: "${REDIS_HOST}"
      port: "${REDIS_PORT}"
      ttl_seconds: 3600
    feature_store:
      enabled: true
      snapshot_enabled: true
    alerts:
      enabled: true
      deduplication_window_seconds: 300
    monitoring:
      enabled: true
      metrics_export_interval_seconds: 60
