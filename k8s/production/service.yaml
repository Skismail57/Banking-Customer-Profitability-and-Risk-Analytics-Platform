apiVersion: v1
kind: Service
metadata:
  name: banking-analytics
  namespace: production
  labels:
    app: banking-analytics
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: banking-analytics
---
apiVersion: v1
kind: Service
metadata:
  name: banking-analytics-external
  namespace: production
  labels:
    app: banking-analytics
spec:
  type: LoadBalancer
  ports:
  - port: 443
    targetPort: 8000
    protocol: TCP
    name: https
  selector:
    app: banking-analytics
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
