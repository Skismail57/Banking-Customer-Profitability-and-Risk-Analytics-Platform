version: '3.8'

# Development override configuration
# Run with: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
# For streaming: docker-compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.streaming.yml up

services:
  # FastAPI with hot reload
  api:
    environment:
      DEBUG: "true"
      LOG_LEVEL: "DEBUG"
    volumes:
      - ./src:/app/src
      - ./api:/app/api
      - ./config:/app/config
      - ./tests:/app/tests
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  # Streamlit with auto-reload
  streamlit:
    environment:
      DEBUG: "true"
    volumes:
      - ./src:/app/src
      - ./streamlit:/app/streamlit
      - ./config:/app/config
    command: ["streamlit", "run", "streamlit/home.py", "--server.port=8501", "--server.address=0.0.0.0", "--server.enableCORS=false", "--server.enableWebsocketCompression=false"]

  # PostgreSQL with development settings
  postgres:
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
