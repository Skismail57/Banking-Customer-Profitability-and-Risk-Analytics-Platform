name: CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'staging'
    environment:
      name: staging
      url: https://staging.banking-analytics.com
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Login to Docker Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_REGISTRY }}/banking-analytics:staging
            ${{ secrets.DOCKER_REGISTRY }}/banking-analytics:staging-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Deploy to Kubernetes
        uses: azure/k8s-deploy@v4
        with:
          manifests: |
            k8s/staging/deployment.yaml
            k8s/staging/service.yaml
          images: |
            ${{ secrets.DOCKER_REGISTRY }}/banking-analytics:staging-${{ github.sha }}
          kubectl-version: 'v1.28.0'
      
      - name: Run smoke tests
        run: |
          pip install requests pytest
          pytest tests/smoke/staging.py -v
      
      - name: Notify deployment status
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Staging deployment ${{ job.status }}'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.event.inputs.environment == 'production'
    environment:
      name: production
      url: https://api.banking-analytics.com
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Login to Docker Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_REGISTRY }}/banking-analytics:production
            ${{ secrets.DOCKER_REGISTRY }}/banking-analytics:production-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Create Kubernetes backup
        run: |
          kubectl get deployment banking-analytics -n production -o yaml > backup-deployment.yaml
      
      - name: Deploy to Kubernetes (canary)
        uses: azure/k8s-deploy@v4
        with:
          manifests: |
            k8s/production/canary-deployment.yaml
          images: |
            ${{ secrets.DOCKER_REGISTRY }}/banking-analytics:production-${{ github.sha }}
          kubectl-version: 'v1.28.0'
      
      - name: Wait for canary deployment
        run: |
          kubectl rollout status deployment/banking-analytics-canary -n production --timeout=5m
      
      - name: Run canary validation
        run: |
          pip install requests pytest
          pytest tests/smoke/production.py -v
      
      - name: Promote canary to production
        run: |
          kubectl scale deployment banking-analytics-canary -n production --replicas=0
          kubectl apply -f k8s/production/deployment.yaml
          kubectl set image deployment/banking-analytics -n production banking-analytics=${{ secrets.DOCKER_REGISTRY }}/banking-analytics:production-${{ github.sha }}
      
      - name: Wait for production deployment
        run: |
          kubectl rollout status deployment/banking-analytics -n production --timeout=10m
      
      - name: Run production smoke tests
        run: |
          pip install requests pytest
          pytest tests/smoke/production.py -v
      
      - name: Rollback on failure
        if: failure()
        run: |
          kubectl apply -f backup-deployment.yaml
          kubectl rollout status deployment/banking-analytics -n production --timeout=5m
      
      - name: Notify deployment status
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Production deployment ${{ job.status }}'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.rollback == 'true'
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Rollback to previous version
        run: |
          kubectl rollout undo deployment/banking-analytics -n production
      
      - name: Wait for rollback
        run: |
          kubectl rollout status deployment/banking-analytics -n production --timeout=5m
      
      - name: Notify rollback status
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Production rollback ${{ job.status }}'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
