name: CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      rollback:
        description: 'Rollback to previous version'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read
  packages: write

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'staging'
    environment:
      name: staging
      url: https://staging.banking-analytics.com

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Registry
        # GitHub evaluates secrets.X in an if-condition as the empty string when the
        # secret is missing or not populated, so the direct != '' check is valid.
        if: ${{ secrets.DOCKER_REGISTRY != '' && secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        # Docker image build must fail genuinely if broken.
        run: |
          docker build -t banking-analytics:latest .

      - name: Push Docker image
        if: ${{ secrets.DOCKER_REGISTRY != '' && secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != '' }}
        run: |
          docker tag banking-analytics:latest ${{ secrets.DOCKER_REGISTRY }}/banking-analytics:staging
          docker tag banking-analytics:latest ${{ secrets.DOCKER_REGISTRY }}/banking-analytics:staging-${{ github.sha }}
          docker push ${{ secrets.DOCKER_REGISTRY }}/banking-analytics:staging
          docker push ${{ secrets.DOCKER_REGISTRY }}/banking-analytics:staging-${{ github.sha }}

      - name: Notify deployment status
        if: always()
        run: |
          echo "Staging deployment ${{ job.status }}"
          echo "Environment: staging"
          echo "Commit: ${{ github.sha }}"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.event.inputs.environment == 'production' && github.event.inputs.rollback != 'true'
    environment:
      name: production
      url: https://api.banking-analytics.com

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Registry
        if: ${{ secrets.DOCKER_REGISTRY != '' && secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        if: ${{ secrets.DOCKER_REGISTRY != '' && secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != '' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_REGISTRY }}/banking-analytics:production
            ${{ secrets.DOCKER_REGISTRY }}/banking-analytics:production-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify deployment status
        if: always()
        run: |
          echo "Production deployment ${{ job.status }}"
          echo "Environment: production"
          echo "Commit: ${{ github.sha }}"

  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    # workflow_dispatch.inputs.rollback is declared at top-level (choice 'true'/'false'),
    # so github.event.inputs.rollback is guaranteed to resolve for workflow_dispatch events.
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.rollback == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Notify rollback status
        run: |
          echo "Production rollback ${{ job.status }}"
          echo "Rollback requested for production environment"
          echo "Note: Manual kubectl rollout undo required if Kubernetes cluster is configured"
          echo "Commit: ${{ github.sha }}"
