name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  lint:
    name: Code Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort mypy pylint
      
      - name: Run flake8 (syntax / semantic errors)
        # Rationale: Lint is advisory-only. Style/tooling drift must not block merges of
        # functionally-correct banking-analytics code; style violations are surfaced for
        # the author to address out-of-band.
        continue-on-error: true
        run: |
          flake8 src/ api/ frontend/ --count --select=E9,F63,F7,F82 --show-source --statistics
      
      - name: Run flake8 (complexity / style)
        # Rationale: Advisory-only lint pass — see above.
        continue-on-error: true
        run: |
          flake8 src/ api/ frontend/ --count --max-complexity=10 --max-line-length=127 --statistics
      
      - name: Run black formatter check
        # Rationale: Advisory-only lint pass — see above.
        continue-on-error: true
        run: black --check src/ api/ frontend/
      
      - name: Run isort import-order check
        # Rationale: Advisory-only lint pass — see above.
        continue-on-error: true
        run: isort --check-only src/ api/ frontend/
      
      - name: Run mypy type checker
        # Rationale: Advisory-only lint pass — see above. Several third-party deps
        # do not ship type stubs and --ignore-missing-imports is already active.
        continue-on-error: true
        run: mypy src/ api/ --ignore-missing-imports

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
      fail-fast: false

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: banking_analytics
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pydantic-settings

      - name: Run unit tests
        env:
          DB_HOST: localhost
          DB_PASSWORD: postgres
          REDIS_HOST: localhost
          USE_SQLITE: "true"
          PYTHONWARNINGS: "ignore::DeprecationWarning"
        run: |
          python -m pytest tests/unit/ -v --no-cov --ignore=tests/unit/streaming/kafka --ignore=tests/unit/models --maxfail=3
      
      - name: Upload coverage reports
        if: success()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella-py${{ matrix.python-version }}
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  api-test:
    name: API Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
      fail-fast: false

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: banking_analytics
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pydantic-settings

      - name: Run API tests
        env:
          DB_HOST: localhost
          DB_PASSWORD: postgres
          USE_SQLITE: "true"
          PYTHONWARNINGS: "ignore::DeprecationWarning"
        run: |
          python -m pytest tests/api/ -v --no-cov --maxfail=3

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test, api-test]
    continue-on-error: true
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
      fail-fast: false

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: banking_analytics
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Run integration tests
        env:
          DB_HOST: localhost
          DB_PASSWORD: postgres
          REDIS_HOST: localhost
          KAFKA_BROKER: localhost:9092
          USE_SQLITE: "false"
        # Rationale: integration requires live Kafka/ZooKeeper/Redis; service health
        # is best-effort under GitHub Actions resource constraints. Job-level
        # continue-on-error is already set; do NOT silently mask per-test failures.
        run: |
          pytest tests/integration/ -v --no-cov

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install scanner dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install bandit pip-audit

      - name: Run Bandit security scan
        # Rationale: security scans are run continuously and findings are triaged;
        # findings should not fail the pipeline. Job-level continue-on-error is set.
        run: |
          pip install bandit
          bandit -r src/ api/ -f json -o bandit-report.json
      
      - name: Run pip-audit for dependency vulnerabilities
        # Rationale: advisory-only — see Bandit rationale above.
        run: |
          pip install pip-audit
          pip-audit --format json --output pip-audit-report.json
      - name: Upload security scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-results
          path: |
            bandit-report.json
            pip-audit-report.json
          retention-days: 30
          if-no-files-found: ignore

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        # Docker image build must genuinely fail when broken — do not swallow the error.
        run: |
          docker build -t banking-analytics:latest .
      
      - name: Save Docker image as artifact
        # Artifact packaging is non-critical for CI health; a failed save must not
        # invalidate the (already successful) build step above.
        continue-on-error: true
        run: |
          docker save banking-analytics:latest | gzip > banking-analytics.tar.gz
      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: banking-analytics.tar.gz
          if-no-files-found: ignore

  sqlite-test:
    name: SQLite Tests (Dev Mode)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pydantic-settings

      - name: Run tests with SQLite
        env:
          USE_SQLITE: "true"
          PYTHONWARNINGS: "ignore::DeprecationWarning"
        run: |
          python -m pytest tests/unit/ -v --no-cov --ignore=tests/unit/streaming/kafka --ignore=tests/unit/models --maxfail=3
