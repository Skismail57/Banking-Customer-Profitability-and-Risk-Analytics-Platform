# Logging Configuration for Streaming Pipeline

version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
  
  detailed:
    format: "%(asctime)s - %(name)s - %(levelname)s - [%(filename)s:%(lineno)d] - %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
  
  json:
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
    class: pythonjsonlogger.jsonlogger.JsonFormatter

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout
  
  console_detailed:
    class: logging.StreamHandler
    level: DEBUG
    formatter: detailed
    stream: ext://sys.stdout
  
  file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: standard
    filename: logs/streaming.log
    maxBytes: 10485760  # 10MB
    backupCount: 5
  
  error_file:
    class: logging.handlers.RotatingFileHandler
    level: ERROR
    formatter: detailed
    filename: logs/streaming_errors.log
    maxBytes: 10485760  # 10MB
    backupCount: 5
  
  json_file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: json
    filename: logs/streaming_json.log
    maxBytes: 10485760  # 10MB
    backupCount: 5

loggers:
  # Streaming module loggers
  src.streaming:
    level: INFO
    handlers: [console, file, json_file]
    propagate: false
  
  src.streaming.orchestrator:
    level: INFO
    handlers: [console, file]
    propagate: false
  
  src.streaming.kafka:
    level: WARNING
    handlers: [console, file]
    propagate: false
  
  src.streaming.processor:
    level: INFO
    handlers: [console, file]
    propagate: false
  
  src.streaming.anomaly:
    level: INFO
    handlers: [console, file]
    propagate: false
  
  src.streaming.risk:
    level: INFO
    handlers: [console, file]
    propagate: false
  
  src.streaming.alerts:
    level: INFO
    handlers: [console, file]
    propagate: false
  
  src.streaming.audit:
    level: INFO
    handlers: [console, file]
    propagate: false
  
  # Root logger
  root:
    level: WARNING
    handlers: [console]
