# Base Database Configuration
database:
  host: localhost
  port: 5432
  name: banking_analytics
  pool_size: 10
  max_overflow: 20
  pool_timeout: 30
  pool_recycle: 3600
  echo: false

# Migration Configuration
migrations:
  directory: sql/migrations
  version_table: alembic_version

# Streaming Infrastructure Configuration
streaming:
  # Redpanda/Kafka Configuration
  broker:
    bootstrap_servers: localhost:9092
    group_id: banking_analytics_group
    auto_offset_reset: earliest
    enable_auto_commit: false
    session_timeout_ms: 30000
    heartbeat_interval_ms: 3000
    max_poll_records: 500
    max_poll_interval_ms: 300000
  
  # Schema Registry Configuration
  schema_registry:
    url: http://localhost:8081
    enable: true
  
  # Redis Configuration
  redis:
    host: localhost
    port: 6379
    db: 0
    password: null
    max_connections: 50
    socket_timeout: 5
    socket_connect_timeout: 5
    retry_on_timeout: true
  
  # Feature Store Configuration
  feature_store:
    ttl_seconds: 86400  # 24 hours
    snapshot_ttl_seconds: 220752000  # 7 years (regulatory)
    key_prefix: banking
  
  # Event Processing Configuration
  event_processing:
    max_processing_time_seconds: 60
    idempotency_ttl_seconds: 86400  # 24 hours
    late_event_window_seconds: 300  # 5 minutes
    watermark_delay_seconds: 60  # 1 minute
  
  # Alert Configuration
  alerts:
    enabled: true
    deduplication_window_seconds: 3600  # 1 hour
    max_alerts_per_customer_per_hour: 10
